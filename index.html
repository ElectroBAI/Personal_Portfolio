<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baibhab Das — Windows Terminal Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Cascadia+Code:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --green:#16c60c;--green-dim:#0ea800;--blue:#3b78ff;--cyan:#61d6d6;
  --yellow:#f9f1a5;--red:#e74856;--purple:#b4009e;--white:#cccccc;
  --dim:#666;--bg:#1e1e1e;--term-bg:rgba(12,12,12,0.82);
  --border:rgba(255,255,255,0.08);--acrylic:rgba(32,32,32,0.75);
  --titlebar:#2c2c2c;--titlebar-text:#c4c4c4;
  --tab-active:#1e1e1e;--tab-inactive:#2d2d2d;
  --win11-accent:#0067c0;
}
html,body{height:100%;overflow:hidden;font-family:'Cascadia Code','Fira Code',monospace;background:#000}
body{
  background:
    radial-gradient(ellipse 120% 80% at 60% 110%,rgba(0,103,192,0.18) 0%,transparent 55%),
    radial-gradient(ellipse 80% 60% at 0% 0%,rgba(22,198,12,0.06) 0%,transparent 50%),
    #141414;
  display:flex;align-items:center;justify-content:center;
}
.wallpaper{
  position:fixed;inset:0;z-index:0;
  background-image:
    linear-gradient(rgba(0,103,192,0.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,103,192,0.04) 1px,transparent 1px);
  background-size:60px 60px;
}
.scanlines{
  position:fixed;inset:0;z-index:500;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.06) 3px,rgba(0,0,0,0.06) 4px);
}
.wt-window{
  position:relative;z-index:200;
  width:min(960px,99vw);height:min(640px,97vh);
  display:flex;flex-direction:column;
  background:var(--acrylic);
  backdrop-filter:blur(40px) saturate(180%) brightness(0.9);
  -webkit-backdrop-filter:blur(40px) saturate(180%) brightness(0.9);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:8px;
  box-shadow:
    0 0 0 1px rgba(0,0,0,0.5),
    0 32px 64px rgba(0,0,0,0.8),
    0 8px 32px rgba(0,0,0,0.6),
    inset 0 1px 0 rgba(255,255,255,0.06);
  overflow:hidden;
}
.titlebar{
  height:36px;background:var(--titlebar);
  display:flex;align-items:stretch;flex-shrink:0;
  user-select:none;border-bottom:1px solid rgba(0,0,0,0.4);
}
.titlebar-tabs{display:flex;align-items:stretch;flex:1;overflow:hidden}
.tab{
  display:flex;align-items:center;gap:8px;padding:0 16px;font-size:12px;color:#999;
  border-right:1px solid rgba(0,0,0,0.3);cursor:default;white-space:nowrap;min-width:160px;
  transition:background .15s;position:relative;
}
.tab.active{
  background:var(--tab-active);color:var(--white);border-top:2px solid var(--win11-accent);
}
.tab.active::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:1px;background:var(--tab-active);}
.tab-icon{font-size:13px}
.tab-close{
  margin-left:auto;width:16px;height:16px;display:flex;align-items:center;justify-content:center;
  border-radius:3px;font-size:10px;color:#666;
}
.tab-close:hover{background:rgba(255,255,255,0.1);color:#ccc}
.tab-new{
  width:36px;display:flex;align-items:center;justify-content:center;
  color:#666;font-size:16px;cursor:pointer;flex-shrink:0;
}
.tab-new:hover{background:rgba(255,255,255,0.06);color:#ccc}
.caption-btns{display:flex;align-items:stretch;flex-shrink:0}
.cap-btn{
  width:46px;display:flex;align-items:center;justify-content:center;
  color:#999;font-size:10px;cursor:pointer;transition:background .1s;
  border:none;background:transparent;font-family:'Cascadia Code',monospace;
}
.cap-btn:hover{background:rgba(255,255,255,0.08);color:#fff}
.cap-btn.close:hover{background:#c42b1c;color:#fff}
.cap-btn svg{width:10px;height:10px;fill:currentColor}
.toolbar{
  height:28px;background:rgba(0,0,0,0.25);
  display:flex;align-items:center;padding:0 12px;gap:8px;
  border-bottom:1px solid rgba(0,0,0,0.3);flex-shrink:0;
}
.toolbar-item{font-size:10px;color:#555;cursor:pointer;padding:2px 8px;border-radius:3px}
.toolbar-item:hover{background:rgba(255,255,255,0.06);color:#999}
.toolbar-spacer{flex:1}
.pane-indicator{font-size:10px;color:#444;display:flex;align-items:center;gap:6px;}
.pane-dot{width:5px;height:5px;border-radius:50%;background:var(--green);box-shadow:0 0 4px var(--green)}
.pane{flex:1;display:flex;flex-direction:column;overflow:hidden;background:rgba(12,12,12,0.6)}
.terminal{
  flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 12px 4px;
  font-size:13px;line-height:1.5;
}
.terminal::-webkit-scrollbar{width:6px}
.terminal::-webkit-scrollbar-track{background:transparent}
.terminal::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:3px}
.terminal::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.2)}
.ln{color:var(--white);white-space:pre-wrap;word-break:break-all;line-height:1.5}
.ln.g{color:var(--green);text-shadow:0 0 8px rgba(22,198,12,0.35)}
.ln.gd{color:var(--green-dim)}
.ln.b{color:var(--blue);text-shadow:0 0 6px rgba(59,120,255,0.3)}
.ln.c{color:var(--cyan)}
.ln.y{color:var(--yellow)}
.ln.r{color:var(--red)}
.ln.p{color:var(--purple)}
.ln.d{color:var(--dim)}
.ln.w{font-weight:600}
.ln.ascii{color:var(--green);font-size:10.5px;line-height:1.2;text-shadow:0 0 10px rgba(22,198,12,0.45)}
.prompt-echo{display:flex;align-items:baseline;gap:0;flex-wrap:wrap}
.ps-user{color:var(--yellow)}
.ps-at{color:var(--dim)}
.ps-host{color:var(--cyan)}
.ps-sep{color:var(--dim)}
.ps-path{color:var(--blue)}
.ps-gt{color:var(--white)}
.ps-cmd{color:var(--white);margin-left:5px}
.input-row{display:flex;align-items:center;padding:2px 12px 10px;flex-shrink:0;}
.ps-live{display:flex;align-items:baseline;gap:0;font-size:13px;flex-shrink:0;white-space:nowrap}
.cmd-input{
  flex:1;background:transparent;border:none;outline:none;
  color:var(--white);font-family:'Cascadia Code','Fira Code',monospace;font-size:13px;
  caret-color:var(--white);margin-left:5px;line-height:1.5;
}
.cmd-input::selection{background:rgba(0,103,192,0.5)}
.statusbar{
  height:22px;background:var(--win11-accent);
  display:flex;align-items:center;padding:0 12px;gap:16px;flex-shrink:0;
}
.sb-item{font-size:10px;color:rgba(255,255,255,0.85);display:flex;align-items:center;gap:5px;white-space:nowrap}
.sb-item.right{margin-left:auto}
.sb-sep{color:rgba(255,255,255,0.3);font-size:14px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.fi{animation:fadeIn .15s ease-out forwards}
@keyframes cur{0%,100%{opacity:1}50%{opacity:0}}
.dri{color:var(--cyan)}
.fli{color:var(--white)}
.exei{color:var(--green)}
/* Autocomplete suggestion */
.suggest{
  position:absolute;bottom:38px;left:12px;
  background:#1a1a2e;border:1px solid rgba(0,103,192,0.5);
  border-radius:4px;padding:4px 0;min-width:200px;max-width:400px;
  z-index:100;box-shadow:0 4px 16px rgba(0,0,0,0.6);
}
.suggest-item{
  padding:3px 12px;font-size:12px;color:#aaa;cursor:pointer;white-space:nowrap;
}
.suggest-item.sel{background:rgba(0,103,192,0.4);color:#fff}
.suggest-item:hover{background:rgba(255,255,255,0.06);color:#fff}
@media(max-width:640px){
  .wt-window{width:100vw;height:100dvh;border-radius:0;border:none}
  .tab{min-width:120px}
  .ln{font-size:11px}
  .ln.ascii{font-size:8px}
  .cmd-input,.ps-live{font-size:11px}
  .toolbar{display:none}
}
</style>
</head>
<body>
<div class="wallpaper"></div>
<div class="scanlines"></div>

<div class="wt-window" id="wtWin">
  <div class="titlebar">
    <div class="titlebar-tabs">

        <span class="tab-close">✕</span>

        <span>Command Prompt</span>
        <span class="tab-close">✕</span>
      </div>
      <div class="tab-new" title="New tab (Ctrl+Shift+T)">+</div>
    </div>
    <div class="caption-btns">
      <button class="cap-btn" title="Help" onclick="runCmd('help')">
        <svg viewBox="0 0 16 16"><path d="M8 5a3 3 0 100 6A3 3 0 008 5zm0 1a2 2 0 110 4A2 2 0 018 6zm0-5C4.134 1 1 4.134 1 8s3.134 7 7 7 7-3.134 7-7-3.134-7-7-7zm0 1a6 6 0 110 12A6 6 0 018 2z"/></svg>
      </button>
      <button class="cap-btn" title="Minimize" onclick="doMinimize()">
        <svg viewBox="0 0 16 16"><rect x="2" y="8" width="12" height="1.5"/></svg>
      </button>
      <button class="cap-btn" title="Maximize/Restore" onclick="doMaximize()">
        <svg viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" rx="0" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
      <button class="cap-btn close" title="Close" onclick="doClose()">
        <svg viewBox="0 0 16 16"><path d="M2.293 2.293a1 1 0 011.414 0L8 6.586l4.293-4.293a1 1 0 111.414 1.414L9.414 8l4.293 4.293a1 1 0 01-1.414 1.414L8 9.414l-4.293 4.293a1 1 0 01-1.414-1.414L6.586 8 2.293 3.707a1 1 0 010-1.414z"/></svg>
      </button>
    </div>
  </div>

  <div class="toolbar">
    <span class="toolbar-item">File</span>
    <span class="toolbar-item">Edit</span>
    <span class="toolbar-item">View</span>
    <span class="toolbar-item">Settings</span>
    <div class="toolbar-spacer"></div>
    <div class="pane-indicator">
      <span class="pane-dot"></span>
      <span style="font-size:10px;color:#444">POWERSHELL 7.4 (x64)</span>
    </div>
  </div>

  <div class="pane" style="position:relative">
    <div class="terminal" id="terminal"></div>
    <div id="suggestBox" class="suggest" style="display:none"></div>
    <div class="input-row" id="inputRow" style="display:none">
      <div class="ps-live" id="livePrompt">
        <span class="ps-user">PS</span>
        <span class="ps-sep">&nbsp;</span>
        <span class="ps-path" id="cwdSpan">C:\Users\Baibhab</span>
        <span class="ps-gt">&gt;</span>
      </div>
      <input class="cmd-input" id="cmdInput" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    </div>
  </div>

  <div class="statusbar">
    <div class="sb-item"><span>⊞ POWERSHELL</span></div>
    <div class="sb-sep">|</div>
    <div class="sb-item" id="sbCpu">CPU 0.0%</div>
    <div class="sb-sep">|</div>
    <div class="sb-item" id="sbMem">RAM 0 MB</div>
    <div class="sb-sep">|</div>
    <div class="sb-item">UTF-8</div>
    <div class="sb-sep">|</div>
    <div class="sb-item">CRLF</div>
    <div class="sb-item right" id="sbClock"></div>
  </div>
</div>

function cwdShort(p){ return p; }

// ── Audio ────────────────────────────────────────────────────────────
let AC;
function ensureAC(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)()}
function playClick(){
  if(!soundOn)return; ensureAC();
  const o=AC.createOscillator(),g=AC.createGain();
  o.connect(g);g.connect(AC.destination);
  o.type='square';o.frequency.value=600+Math.random()*300;
  g.gain.setValueAtTime(0.03,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+0.035);
  o.start();o.stop(AC.currentTime+0.035);
}
function playStartup(){
  ensureAC();
  [[523,0],[659,0.1],[784,0.2],[1047,0.32]].forEach(([f,t])=>{
    const o=AC.createOscillator(),g=AC.createGain();
    o.connect(g);g.connect(AC.destination);
    o.frequency.value=f;o.type='sine';
    const s=AC.currentTime+t;
    g.gain.setValueAtTime(0,s);
    g.gain.linearRampToValueAtTime(0.05,s+0.05);
    g.gain.exponentialRampToValueAtTime(0.001,s+0.22);
    o.start(s);o.stop(s+0.22);
  });
}

// ── DOM helpers ──────────────────────────────────────────────────────
function addLine(txt,cls='',delay=0){
  return new Promise(r=>setTimeout(()=>{
    const d=document.createElement('div');
    d.className='ln fi'+(cls?' '+cls:'');
    d.textContent=txt;
    term.appendChild(d);
    term.scrollTop=term.scrollHeight;
    r();
  },delay));
}
function addHTML(html,cls='',delay=0){
  return new Promise(r=>setTimeout(()=>{
    const d=document.createElement('div');
    d.className='ln fi'+(cls?' '+cls:'');
    d.innerHTML=html;
    term.appendChild(d);
    term.scrollTop=term.scrollHeight;
    r();
  },delay));
}
function addBlank(delay=0){return addLine('','d',delay)}

function echoPrompt(cmd){
  const d=document.createElement('div');
  d.className='prompt-echo fi';
  d.innerHTML=`<span class="ps-user">PS</span> <span class="ps-path">${esc(cwdShort(cwd))}</span><span class="ps-gt">&gt;</span><span class="ps-cmd">${esc(cmd)}</span>`;
  term.appendChild(d);
  term.scrollTop=term.scrollHeight;
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function renderLines(lines){
  lines.forEach(([t,c])=>{
    if(c==='__html') addHTML(t);
    else addLine(t,c||'');
  });
  term.scrollTop=term.scrollHeight;
}

// ── Tab completion: commands + files in current dir ──────────────────
const ALL_CMDS=['whoami','help','ls','dir','cd','cat','clear','cls','sudo','history',
  'neofetch','contact','projects','sound','pwd','date','echo','ver','systeminfo',
  'Get-ChildItem','Set-Location','Get-Content','Clear-Host'];

function getCandidates(partial){
  const p=partial.toLowerCase();
  const parts=partial.split(/\s+/);

  // If typing first word → complete commands
  if(parts.length===1){
    return ALL_CMDS.filter(c=>c.toLowerCase().startsWith(p)&&c.toLowerCase()!==p);
  }

  // If typing argument to cd/cat/ls → complete filesystem entries
  const cmd=parts[0].toLowerCase();
  const arg=parts.slice(1).join(' ');
  if(['cd','set-location','cat','get-content'].includes(cmd)){
    const node=FS[cwd];
    if(!node) return [];
    const argLower=arg.toLowerCase();
    return node.children
      .filter(c=>c.toLowerCase().startsWith(argLower)&&c.toLowerCase()!==argLower)
      .map(c=>parts[0]+' '+c);
  }
  return [];
}

// ── Suggest box ──────────────────────────────────────────────────────
function showSuggest(items, partial){
  sugItems=items; sugIdx=0;
  sugBox.innerHTML='';
  items.slice(0,8).forEach((item,i)=>{
    const d=document.createElement('div');
    d.className='suggest-item'+(i===0?' sel':'');
    d.textContent=item;
    d.onmousedown=(e)=>{e.preventDefault();inp.value=item;hideSuggest();inp.focus();};
    sugBox.appendChild(d);
  });
  sugBox.style.display=items.length?'block':'none';
}
function hideSuggest(){sugBox.style.display='none';sugItems=[];sugIdx=-1;}
function moveSuggest(dir){
  if(!sugItems.length) return;
  sugIdx=Math.max(0,Math.min(sugItems.length-1,sugIdx+dir));
  [...sugBox.children].forEach((el,i)=>{
    el.classList.toggle('sel',i===sugIdx);
  });
  inp.value=sugItems[sugIdx];
}

// ── Process command ──────────────────────────────────────────────────
function runCmd(raw){
  const tr=raw.trim();
  hideSuggest();
  if(!tr) return;
  if(hist[0]!==tr) hist.unshift(tr);
  if(hist.length>100) hist.pop();
  hidx=-1;
  playClick();
  echoPrompt(tr);

  const parts=tr.split(/\s+/);
  const cmd=parts[0].toLowerCase();
  const args=parts.slice(1);

  if(cmd==='clear'||cmd==='cls'||cmd==='clear-host'){term.innerHTML='';return}

  // ── ls / dir ──
  if(cmd==='ls'||cmd==='dir'||cmd==='get-childitem'){
    const node=FS[cwd];
    const items=node?node.children:[];
    addBlank();
    if(!items.length){addLine('    (empty directory)','d');addBlank();return}
    addLine(`    Directory: ${cwdShort(cwd)}`,'d');
    addBlank();
    addLine('    Mode                 LastWriteTime         Length Name','d');
    addLine('    ----                 -------------         ------ ----','d');
    const now=new Date();
    const ds=now.toLocaleDateString('en-GB')+' '+now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
    items.forEach(item=>{
      const fullPath=cwd+'\\'+item;
      const isDir=!!FS[fullPath];
      const mode=isDir?'d----':'-----';
      const cls=isDir?'dri':(item.endsWith('.md')||item.endsWith('.txt')?'fli':(item.endsWith('.lnk')?'p':'exei'));
      const len=isDir?'':String(Math.floor(Math.random()*8000+500));
      const d=document.createElement('div');
      d.className='ln fi';
      d.innerHTML=`    <span style="color:var(--dim)">${mode}  ${ds}  ${isDir?'     ':len.padStart(6)}</span> <span class="${cls}">${esc(item)}</span>`;
      term.appendChild(d);
    });
    addBlank();
    term.scrollTop=term.scrollHeight;
    return;
  }

  // ── cd ──
  if(cmd==='cd'||cmd==='set-location'){
    const tgt=args[0];
    if(!tgt||tgt==='~'||tgt==='%userprofile%'){
      cwd=ROOT;cwdSpan.textContent=cwdShort(cwd);addBlank();return;
    }
    if(tgt==='..'||tgt==='..\\'){
      const p=cwd.lastIndexOf('\\');
      if(p>2){cwd=cwd.slice(0,p);cwdSpan.textContent=cwdShort(cwd);}
      addBlank();return;
    }
    // Resolve: could be absolute or relative; strip trailing backslash
    const cleaned=tgt.replace(/\\$/,'');
    const full=cleaned.startsWith('C:\\')?cleaned:(cwd+'\\'+cleaned);
    if(FS[full]){
      cwd=full;cwdSpan.textContent=cwdShort(cwd);addBlank();
    } else {
      addLine(`    Set-Location: Cannot find path '${tgt}' because it does not exist.`,'r');
      addBlank();
    }
    return;
  }

  // ── cat ──
  if(cmd==='cat'||cmd==='get-content'){
    if(!args[0]){addLine('    Usage: cat <filename>','y');addBlank();return}
    // Strip any leading path, just use filename
    const fname=args[0].replace(/^.*[\\\/]/,'');
    if(CAT[fname]){renderLines(CAT[fname]());}
    else{addLine(`    Get-Content: Cannot find path '${args[0]}': No such file.`,'r');addBlank();}
    return;
  }

  if(CMDS[cmd]){renderLines(CMDS[cmd](args));return}

  addLine(`    ${esc(parts[0])} : The term '${esc(parts[0])}' is not recognized as the name of a cmdlet,`,'r');
  addLine(`    function, script file, or operable program. Check the spelling or type "help".`,'d');
  addBlank();
}

    ['    Applying kernel optimizations... done','gd',680],
    ['    All systems nominal. Welcome back, Baibhab.','g',730],
    ['','d',780],
    ['    ═══════════════════════════════════════════════════════════','gd',810],
  ];

  for(const [t,c,d] of bootLines) await addLine(t,c,d);

  let ad=840;
  for(const line of ascii){await addLine(line,'ascii',ad);ad+=18;}

  const info=[
    ['','d',ad+10],
    ['    ═══════════════════════════════════════════════════════════','gd',ad+30],
    ['    System Status  :  ● ONLINE','g w',ad+50],
    ['    Authorized User:  Former Student of M.P. Birla Foundation','',ad+70],
    ['    Expertise      :  Linux Systems | Robotics | Hardware Engineering','c',ad+90],
    ['    Session Start  :  '+new Date().toLocaleString('en-IN',{timeZone:'Asia/Kolkata'})+' IST','d',ad+110],
    ['    ═══════════════════════════════════════════════════════════','gd',ad+130],
    ['','d',ad+150],
    ['    Type "help" for commands  |  "projects" for project list','gd',ad+170],
    ['    Tab autocompletes commands AND filenames in current dir.','d',ad+190],
    ['','d',ad+210],
  ];
  for(const [t,c,d] of info) await addLine(t,c,d);

  setTimeout(()=>{
    try{playStartup();}catch(e){}
    inpRow.style.display='flex';
    inp.focus();booting=false;
  },ad+240);
}

// ── Status bar ───────────────────────────────────────────────────────
const sbCpu=document.getElementById('sbCpu');
const sbMem=document.getElementById('sbMem');
const sbClk=document.getElementById('sbClock');
setInterval(()=>{
  sbCpu.textContent='CPU '+(Math.random()*6+0.5).toFixed(1)+'%';
  sbMem.textContent='RAM '+(Math.random()*160+520).toFixed(0)+' MB';
  sbClk.textContent=new Date().toLocaleTimeString('en-IN',{timeZone:'Asia/Kolkata',hour:'2-digit',minute:'2-digit',second:'2-digit'})+' IST';
},1000);

// ── Input handling ───────────────────────────────────────────────────
inp.addEventListener('input',()=>{
  const v=inp.value;
  if(!v.trim()){hideSuggest();return;}
  const candidates=getCandidates(v);
  if(candidates.length>1) showSuggest(candidates,v);
  else hideSuggest();
});

inp.addEventListener('keydown',e=>{
  // If suggest box open, navigate it
  if(sugItems.length&&(e.key==='ArrowUp'||e.key==='ArrowDown')){
    e.preventDefault();
    moveSuggest(e.key==='ArrowDown'?1:-1);
    return;
  }
  if(sugItems.length&&e.key==='Escape'){hideSuggest();return;}

  if(e.key==='Enter'){
    const v=inp.value;inp.value='';hideSuggest();runCmd(v);
  }
  else if(e.key==='ArrowUp'){
    e.preventDefault();
    if(hidx<hist.length-1){hidx++;inp.value=hist[hidx];}
    requestAnimationFrame(()=>inp.setSelectionRange(inp.value.length,inp.value.length));
  }
  else if(e.key==='ArrowDown'){
    e.preventDefault();
    if(hidx>0){hidx--;inp.value=hist[hidx];}else{hidx=-1;inp.value='';}
  }
  else if(e.key==='Tab'){
    e.preventDefault();
    const v=inp.value;
    const candidates=getCandidates(v);
    if(candidates.length===1){
      inp.value=candidates[0];hideSuggest();
    } else if(candidates.length>1){
      showSuggest(candidates,v);
    }
  }
  else if(e.key==='l'&&e.ctrlKey){e.preventDefault();term.innerHTML='';}
  else if(e.key==='c'&&e.ctrlKey){e.preventDefault();echoPrompt(inp.value+'^C');inp.value='';hideSuggest();}
  playClick();
});

// Hide suggest when clicking outside
document.addEventListener('mousedown',(e)=>{
  if(!sugBox.contains(e.target)&&e.target!==inp) hideSuggest();
});

document.addEventListener('click',()=>{if(!booting)inp.focus();});

// ── Window controls ──────────────────────────────────────────────────
function doMinimize(){
  const w=document.getElementById('wtWin');
  w.style.transition='transform .25s,opacity .25s';
  w.style.transform='scale(0.92)';w.style.opacity='0.2';
  setTimeout(()=>{w.style.transform='';w.style.opacity='1';inp.focus();},1000);
}
function doClose(){
  const w=document.getElementById('wtWin');
  w.style.transition='transform .2s,opacity .2s';
  w.style.transform='scale(0.95)';w.style.opacity='0';
  setTimeout(()=>{w.style.transform='scale(1)';w.style.opacity='1';},800);
}
function doMaximize(){
  const w=document.getElementById('wtWin');
  maximized=!maximized;
  if(maximized){
    w.style.width='100vw';w.style.height='100vh';
    w.style.borderRadius='0';w.style.border='none';
  } else {
    w.style.width='';w.style.height='';
    w.style.borderRadius='8px';w.style.border='';
  }
  inp.focus();
}

boot();
</script>
